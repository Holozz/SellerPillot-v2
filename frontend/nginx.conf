server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/v2/ {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
    location / { try_files $uri $uri/ /index.html; }
}

name: sellerpilot-v2
x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DB_HOST: mysql
    DB_PORT: 3306
    QUEUE_REDIS_URL: redis://queue:6379/0
    CACHE_REDIS_URL: redis://cache:6379/0
    QDRANT_URL: http://qdrant:6333
    S3_ENDPOINT: http://objects:9000
  depends_on:
    mysql: {condition: service_healthy}
    queue: {condition: service_healthy}
  restart: unless-stopped
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sellerpilot_v2}
      MYSQL_USER: ${DB_USER:-sellerpilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_as_cs, --default-time-zone=+00:00]
    ports: ["127.0.0.1:3309:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      retries: 30
  queue:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:6381:6379"]
    volumes: [queue_data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, retries: 10}
  cache:
    image: redis:7.4-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    ports: ["127.0.0.1:6382:6379"]
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["127.0.0.1:6335:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  objects:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    volumes: [object_data:/data]
  api:
    <<: *app
    command: [sh, -c, 'alembic upgrade head && uvicorn main:app --app-dir backend --host 0.0.0.0 --port 8000']
    ports: ["127.0.0.1:8002:8000"]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=2)']
      interval: 5s
      retries: 30
  control:
    <<: *app
    command: [python, -m, v2.worker, control]
    depends_on: {api: {condition: service_healthy}, queue: {condition: service_healthy}}
  document-worker:
    <<: *app
    command: [python, -m, v2.worker, build]
    depends_on: {api: {condition: service_healthy}, queue: {condition: service_healthy}, qdrant: {condition: service_started}, objects: {condition: service_started}}
  agent-worker:
    <<: *app
    command: [python, -m, v2.worker, agent]
    depends_on: {api: {condition: service_healthy}, queue: {condition: service_healthy}}
  web:
    build: {context: frontend}
    ports: ["127.0.0.1:5190:80"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9092:9090"]
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    ports: ["127.0.0.1:3002:3000"]
    volumes: [./deploy/grafana:/etc/grafana/provisioning:ro]
volumes:
  mysql_data:
  queue_data:
  qdrant_data:
  object_data:
